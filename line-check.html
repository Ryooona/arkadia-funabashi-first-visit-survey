<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arkadia船橋店 LINE送信確認</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px auto;padding:0 20px;max-width:640px;color:#202124}button{padding:16px;border:0;border-radius:10px;background:#06c755;color:white;font-size:16px;width:100%}button:disabled{background:#d1d5db;color:#6b7280}pre{background:#f3f4f6;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}p{line-height:1.7}
</style>
<h1>LINE送信確認</h1>
<p>店舗管理者向けの確認画面です。アンケート回答の保存・クーポンの発行は行いません。</p>
<p>下のボタンを押すと、開いた元の1対1トークへ、お客様側から「初回来場アンケート」を1通送信します。</p>
<button id="send" disabled>LINE接続を確認中…</button>
<pre id="result" aria-live="polite">読み込み中…</pre>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const button = document.getElementById('send');
const result = document.getElementById('result');
const report = {build:'20261025.check1'};
const render = () => { result.textContent = JSON.stringify(report, null, 2); };
const errorDetails = error => ({code:String(error && error.code || 'unknown'),message:String(error && error.message || '不明なエラー')});
async function start() {
  try {
    // 動作している体験会予約と同じ初期化オプション。
    await liff.init({liffId:'2011208625-nZvVWFJC'});
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const context = liff.getContext();
    report.inClient = liff.isInClient();
    report.contextType = context && context.type || 'unknown';
    report.configuredScope = context && context.scope || [];
    report.sdkVersion = liff.getVersion();
    report.lineVersion = liff.getLineVersion();
    try { report.permission = (await liff.permission.query('chat_message.write')).state; }
    catch (error) { report.permissionError = errorDetails(error); }
    try { report.grantedScopes = await liff.permission.getGrantedAll(); }
    catch (error) { report.grantedScopesError = errorDetails(error); }
    if (!report.inClient || report.contextType !== 'utou') {
      report.result = '公式LINEの1対1トークへこのURLを貼り、そのトーク内から開いてください。';
      button.textContent = '公式LINEのトークから開いてください';
    } else {
      button.disabled = false;
      button.textContent = '「初回来場アンケート」を1通送って確認';
      report.result = '確認ボタンを押してください。';
    }
  } catch (error) {
    report.initializationError = errorDetails(error);
    button.textContent = 'LINE接続を確認できませんでした';
  }
  render();
}
button.addEventListener('click', async () => {
  if (button.disabled) return;
  button.disabled = true;
  button.textContent = '送信を確認中…';
  let timer;
  try {
    await Promise.race([
      liff.sendMessages([{type:'text',text:'初回来場アンケート'}]),
      new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('LINE_SEND_TIMEOUT')),15000);})
    ]);
    report.result = '送信成功：店舗側のトークでも確認してください。';
    button.textContent = '送信しました';
  } catch (error) {
    report.result = '送信失敗';
    report.sendError = errorDetails(error);
    button.textContent = '確認結果をこのチャットへお知らせください';
  } finally { clearTimeout(timer); render(); }
});
start();
</script>
</html>
