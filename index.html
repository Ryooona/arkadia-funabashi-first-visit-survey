const birthMonthInput =

const birthDayInput =

    const currentYear =
  new Date().getFullYear();

for (
  let year = currentYear;
  year >= 1900;
  year--
) {
  const option =
    document.createElement('option');

  option.value = year;
  option.textContent = year + '年';

  birthYearInput.appendChild(option);
}


function updateBirthDays() {
  const year =
    Number(birthYearInput.value);

  const month =
    Number(birthMonthInput.value);

  birthDayInput.innerHTML =
    '<option value="">日</option>';

  if (!year || !month) {
    birthDayInput.disabled = true;
    return;
  }

  const daysInMonth =
    new Date(year, month, 0).getDate();

  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {
    const option =
      document.createElement('option');

    option.value = day;
    option.textContent = day + '日';

    birthDayInput.appendChild(option);
  }

  birthDayInput.disabled = false;
}


birthYearInput.addEventListener(
  'change',
  updateBirthDays
);

birthMonthInput.addEventListener(
  'change',
  updateBirthDays
);


function getBirthday() {
  if (
    !birthYearInput.value ||
    !birthMonthInput.value ||
    !birthDayInput.value
  ) {
    return '';
  }

  const month =
    String(
      birthMonthInput.value
    ).padStart(2, '0');

  const day =
    String(
      birthDayInput.value
    ).padStart(2, '0');

  return (
    birthYearInput.value +
    '/' +
    month +
    '/' +
    day
  );
}
    
    const pokerExperienceInput =

const trialInput =

const sourceDetailSelect =

const sourceDetailLabel =

const sourceDetailSelectLabel =

function resetSourceDetail() {
  sourceDetailArea.style.display =
    'none';

  sourceDetailSelectArea.style.display =
    'none';

  sourceDetailInput.required =
    false;

  sourceDetailSelect.required =
    false;

  sourceDetailInput.value =
    '';

  sourceDetailSelect.innerHTML =
    '<option value="">選択してください</option>';
}


function showSourceText(
  label,
  placeholder
) {
  sourceDetailArea.style.display =
    'block';

  sourceDetailSelectArea.style.display =
    'none';

  sourceDetailLabel.childNodes[0].textContent =
    label + ' ';

  sourceDetailInput.placeholder =
    placeholder || '';

  sourceDetailInput.required =
    true;

  sourceDetailSelect.required =
    false;
}


function showSourceSelect(
  label,
  options
) {
  sourceDetailArea.style.display =
    'none';

  sourceDetailSelectArea.style.display =
    'block';

  sourceDetailSelectLabel.childNodes[0].textContent =
    label + ' ';

  sourceDetailSelect.innerHTML =
    '<option value="">選択してください</option>';

  options.forEach(
    optionText => {
      const option =
        document.createElement('option');

      option.value =
        optionText;

      option.textContent =
        optionText;

      sourceDetailSelect.appendChild(
        option
      );
    }
  );

  sourceDetailInput.required =
    false;

  sourceDetailSelect.required =
    true;
}


sourceInput.addEventListener(
  'change',

            '関連動画から知った',

        showSourceText(

      case '通りすがり':

   function getSourceDetail() {
  if (
    sourceDetailSelectArea.style.display !== 'none'
  ) {
    if (
      sourceDetailSelect.value === 'その他'
    ) {
      return (
        'その他：' +
        sourceDetailInput.value
      );
    }

    return sourceDetailSelect.value;
  }

  if (
    sourceDetailArea.style.display !== 'none'
  ) {
    return sourceDetailInput.value;
  }

  return '';
}

    sourceDetailSelect.addEventListener(
  'change',

      sourceDetailInput.required =

);

    let idToken = '';

    async function start() {
      try {

        if (
          typeof liff === 'undefined'
        ) {
          throw new Error(
            'LIFF SDKを読み込めませんでした。'
          );
        }

        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        idToken =
          liff.getIDToken() || '';

        accessToken =
          liff.getAccessToken() || '';

        if (
          !idToken &&
          !accessToken
        ) {
          throw new Error(
            'LINEの本人確認情報を取得できませんでした。'
          );
        }

        button.disabled = false;

        button.textContent =
          '回答してクーポンを受け取る';

        hideMessage();

      } catch (error) {

        console.error(error);

        button.disabled = true;

        button.textContent =
          '読み込みできません';

        showMessage(
          error &&
          error.message
            ? error.message
            : 'LINEからもう一度開いてください。'
        );
      }
    }


form.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    if (!form.reportValidity()) {
      return;
    }

    confirmContent.innerHTML = '';

const confirmItems = [

];

if (

) {

confirmItems.push([

const sourceDetailValue =

if (sourceDetailValue) {

    });

);

    form.style.display =
      'block';

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  }
);

// 回答保存と通知送信を分け、通知の再試行で回答を二重登録しない。
const notificationText = '初回来場アンケート回答';
let notificationSent = false;
let notificationSending = false;

async function sendSurveyNotification() {
  if (notificationSent || notificationSending) return;
  const area = document.getElementById('notificationArea');
  const status = document.getElementById('notificationStatus');
  const retry = document.getElementById('retryNotification');
  area.style.display = 'block';
  retry.style.display = 'none';
  notificationSending = true;
  status.textContent = '運営への通知メッセージを送信中…';
  try {
    const context = liff.getContext();
    // グループなど別の宛先へ通知しない。
    if (!liff.isInClient() || !context || context.type !== 'utou') {
      status.textContent = '回答は保存済みです。運営への通知のため、Arkadia船橋店の公式LINEのトークへ戻り「' + notificationText + '」と送信してください。';
      return;
    }
    await liff.sendMessages([{ type: 'text', text: notificationText }]);
    notificationSent = true;
    status.textContent = '運営への通知メッセージを送信しました。';
  } catch (error) {
    status.textContent = '回答は保存済みですが、通知メッセージを送れませんでした。下のボタンで再送するか、Arkadia船橋店の公式LINEへ「' + notificationText + '」と送信してください。';
    retry.style.display = 'block';
  } finally {
    notificationSending = false;
  }
}

document.getElementById('retryNotification').addEventListener('click', sendSurveyNotification);

confirmSubmit.addEventListener(
  'click',
  async () => {

    if (
      !idToken &&
      !accessToken
    ) {
      showMessage(
        'LINEの本人確認情報を取得できませんでした。'
      );

      return;
    }

    confirmSubmit.disabled = true;
    backButton.disabled = true;

    confirmSubmit.textContent =
      '送信中…';

    hideMessage();

    try {

      const response =
        await fetch(
          GAS_API_URL,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body:
              JSON.stringify({

                pppNickname:
                  pppNicknameInput.value,

                pppId:
                  pppIdInput.value,

                age:
                  ageInput.value,

                gender:
                  genderInput.value,

                birthday:
  getBirthday(),

                pokerExperience:
                  pokerExperienceInput.value,

                trial:
                  trialInput.value,

                source:
                  sourceInput.value,

                sourceDetail:
  getSourceDetail(),

                idToken:
                  idToken,

                accessToken:
                  accessToken
              })
          }
        );

      const text =
        await response.text();

      let result;

      try {
        result =
          JSON.parse(text);

      } catch (error) {
        throw new Error(
          'サーバーから正しい応答を取得できませんでした。'
        );
      }

      if (
        result &&
        result.ok
      ) {

        confirmArea.style.display =
          'none';

        showMessage(
          'ご回答ありがとうございました。' +
          'LINEに届いたクーポンをスタッフへご提示ください。',
          'success'
        );

        await sendSurveyNotification();
        return;
      }

      showMessage(
        result &&
        result.message
          ? result.message
          : '回答を送信できませんでした。'
      );

      confirmSubmit.disabled =
        false;

      backButton.disabled =
        false;

      confirmSubmit.textContent =
        'この内容で回答する';

    } catch (error) {

      console.error(error);

      showMessage(
        error &&
        error.message
          ? error.message
          : '回答を送信できませんでした。'
      );

      confirmSubmit.disabled =
        false;

      backButton.disabled =
        false;

      confirmSubmit.textContent =
        'この内容で回答する';
    }
  }
);
    
    start();

  </script>
